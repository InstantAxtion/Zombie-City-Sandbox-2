# ---------------------------------------------------------------- rules
# The numbers the simulation runs on. Rates are per game second unless said otherwise.
[rules default]
# indoors: bites per zombie per second among people sheltering, seconds for the infected to turn
indoorBite = 0.003
# how hard the sheltering are to find: bites slow down where few people are left (people per sector)
indoorDensity = 10000
turnTime = 40
# armed units clearing buildings: the dead destroyed per armed person per second
clearRate = 0.015
# fights resolved as numbers (where nobody watches): the dead destroyed per armed person per second, and
# armed people lost per zombie per second
aggregateKill = 0.1
aggregateLoss = 0.00015
# police per resident, kept at the stations
policePerResident = 0.0022
# seconds an idle squad waits at home before standing down into the station's pool
standDown = 20
# national mobilisation: game seconds between new army formations arriving (the Guard a quarter slower)
mobiliseEvery = 90
# the dead in the heat lose this share an hour above 28 C; the cold slows them below 0 C
rotPerHour = 0.004
coldSpeed = 0.7

# ---------------------------------------------------------------- infrastructure and logistics
# Food is counted in person-days, fuel in tonnes, medicine in doses. Speeds in px per game second.
[rules logistics]
# days of food each city and town keeps at the start, and what one person eats a day
foodDays = 5
townFoodDays = 4
eatPerDay = 1
# person-days a sampled farmland tile grows a day (farms feed the nearest town)
farmYield = 2
# days without water before people start walking out
waterDays = 2
# hospital medicine used per infected person a day
medPerInfected = 0.5
# tonnes of fuel a formation burns per game second on the move
formationFuel = 0.02
convoySpeed = 35
trainSpeed = 90
planeSpeed = 500
shipSpeed = 25
# ---------------------------------------------------------------- government, media and society
# What the authorities are told (share of the real count, seconds to catch up), with and without telephones.
[rules society]
reportShare = 0.8
reportShareNoPhones = 0.3
reportLag = 60
reportLagNoPhones = 400
# the reported dead at which: a mayor orders people to shelter in place, a mayor evacuates, a governor
# quarantines a town (and gives the quarantine up), the president declares martial law and mobilises
shelterAt = 15
evacuateAt = 400
quarantineAt = 250
quarantineGiveUp = 2500
martialLawAt = 1200
mobiliseAt = 5000
# fear at which people leave by themselves, and the share of a town that goes each second above it
fleeAt = 0.55
fleeRate = 0.002
# families crossing town to each other: for how long after the first call, and how fast
familyWindow = 240
familyRate = 0.002
# seconds a threatened street must hold before it barricades itself in
holdoutAfter = 1440
# militias form below this many police per thousand people, above this fear, up to this share of the town
militiaPolicePerThousand = 0.6
militiaFear = 0.45
militiaShare = 0.003
# looting below this trust and above this fear; the chance a looted building burns
lootTrust = 35
lootFear = 0.5
lootFire = 0.25
# a camp forms when a town holds more than this many times its own people
campCrowding = 1.1
