[rules ecology]
# hunger: game days without feeding until the dead are starving; how restless hunger makes them (x migration)
hungerDays = 2
hungerRestless = 2
# the starving fall apart: share lost per game day at full hunger
starvePerDay = 0.02
# the dead in a sector before they set off as a horde (fewer when hungry); a horde this big may split
hordeSize = 300
hordeSplit = 3000
# nests: the dead (counted) and days with no people before a sector becomes a nest; days for a new strain there
nestMin = 400
nestDays = 2
strainDays = 1.5
# share of a formation's losses who were bitten and hid it (they turn inside the lines later)
hiddenBitten = 0.12

[rules fires]
# fires grow to full in about this many game seconds, burn this long at full before the building comes down
fireGrow = 600
fireBurnout = 900
# chance a second, per burning building at full heat, of setting a neighbour alight
fireSpread = 0.004
# chance a game hour, per 100,000 people sheltering without power or water, of a fire starting untended
fireUntended = 0.5
# how fast a crew of four puts a fire out (heat a second), and how fast rain does
fireCrew = 0.0012
fireRain = 0.004
# firefighters per resident at each fire station (plus a few)
firePerResident = 0.0001

[rules navy]
# coast guard: share of a coastal evacuating sector's people taken off by boat each game second
coastGuard = 0.0015
# a formation moving further than this (px) is flown, if there are working airfields at both ends
airliftDistance = 9000

[rules engineers]
# seconds a formation with engineers holds before setting up a forward operating base (ammo point, field hospital)
fobAfter = 600
# share of losses who are wounded rather than killed, and game hours for the field hospital to return them
wounded = 0.3
recoverHours = 6
# most barricades the engineers will build across cordon streets
maxBarricades = 40
