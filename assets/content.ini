# ---------------------------------------------------------------- scenarios
# mode: sandbox / commander / survivor. origin: where it starts. goal (commander): hold / evacuate / retake / protect.
# hordes / hordeSize: hordes that start at the country's edges and march on the people.
# role: who the player is (god, president, military, incident, precinct, squad, officer, survivor).
# season: day of the year it starts on (0 = 1 January). origin xy:0.4,0.6 = a place on the map.
# Goals: hold / evacuate / retake / protect / survive (one region), holdcity / evaccoast / retakestate / protectcap (a country).
[scenario sandbox]
name = Open sandbox
mode = sandbox
origin = none
desc = A calm country going about its day. Paint the dead anywhere and watch the whole country respond.

[scenario lab_leak]
name = Lab leak
mode = sandbox
origin = lab
zombies = 25
desc = Something got out of a research building downtown. It starts with a handful of staff.

[scenario airliner]
name = Crashed airliner
mode = sandbox
origin = crash
zombies = 260
desc = A passenger jet came down in the fields outside the city. The passengers are walking.

[scenario prison]
name = Prison riot
mode = sandbox
origin = prison
zombies = 60
desc = The county prison went quiet an hour ago. Then the gates opened.

[scenario festival]
name = Summer festival
mode = sandbox
origin = festival
zombies = 30
desc = Thousands are in the park for a festival when the first bites happen in the crowd.

[scenario hold_city]
name = Hold the capital for 30 days
mode = commander
origin = lab
zombies = 4000
hordes = 4
hordeSize = 20000
goal = holdcity
days = 30
desc = It starts in a lab in the capital, and hordes are already loose in the country. Keep at least half of the capital alive for thirty days. Use fast-forward for the quiet stretches.

[scenario evacuate]
name = Evacuate the coast
mode = commander
origin = port
zombies = 6000
hordes = 2
hordeSize = 15000
goal = evaccoast
days = 6
desc = A ship full of the dead docked overnight. Get six in ten of the people on the coast inland within six days, before the hordes reach them.

[scenario retake]
name = Retake the state
mode = commander
origin = state
zombies = 150000
goal = retakestate
days = 20
desc = One state has fallen. Its towns are nests and hordes roam its fields. Bring the dead there below 200 within twenty days.

[scenario protect]
name = Protect the capital
mode = commander
origin = edges
zombies = 240000
goal = protectcap
days = 15
desc = Hordes of tens of thousands are marching on the capital from every side. Don't let more than 2,000 of the dead inside it for fifteen days.

[scenario port]
name = The ship
mode = sandbox
origin = port
zombies = 800
desc = A cargo ship drifts into the harbour at dawn. Nobody answers the radio. Then the hatches open.

[scenario random]
name = Somewhere
mode = sandbox
origin = random
zombies = 300
desc = It starts somewhere in the country: a city or a town picked by the seed. Find it before it spreads.

[scenario officer]
name = On patrol
mode = survivor
origin = lab
zombies = 200
role = officer
goal = survive
days = 2
desc = You are a police officer with your patrol when the calls start. Stay alive for two days.

[scenario survivor]
name = Survivor
mode = survivor
origin = lab
zombies = 60
hordes = 2
hordeSize = 900
goal = survive
days = 2
desc = You are one person in the city when it starts. Survive for two days, or reach an evacuation point.

