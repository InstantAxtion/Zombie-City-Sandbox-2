# ---------------------------------------------------------------- people
# kind: civ / cop / soldier. armor: share of bite harm stopped. infect: bite infection multiplier.
# aim 0..1, nerve 0..1 (how long they hold under pressure). grenade: a second weapon used on packs.
# doctrine (police / army / swat; by kind if left out): how they're trained to fight. Police: stopping power,
# close-range headshots, cover. Army: suppressing fire, bounding (half move while half cover). SWAT: breaching
