# Zombie City Sandbox 2 - game content.
# Every person, weapon, vehicle, zombie and scenario in the game is defined here, not in code.
# Sections are [kind id]. Speeds are in pixels per second (a tile is 16 px, about 4 m).
# Add a section to add a type; the game picks it up on the next start. Unknown keys are ignored.
# A rule written key@national (in a [rules] section) replaces key on national (real-scale) maps only. A rule's value
# may carry a unit, converted at 4 m tiles and 60 game seconds a game hour: "2 km/h" (x 66.7 px/s), "20 km" (x 4,000 px),
# "500 m". National sectors are 64 tiles across, four times the area of today's, so per-sector counts of the dead are
# x4 there; but they hold real densities of people (a few hundred, where today's hold thousands), so the numbers about
# people per sector (indoorDensity, sectorSpill, overrunRatio) are far lower there.

