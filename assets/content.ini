# ---------------------------------------------------------------- scenarios
# mode: sandbox / commander / survivor. origin: where it starts. goal (commander): hold / evacuate / retake / protect.
# hordes / hordeSize: hordes that start at the country's edges and march on the people.
# role: who the player is (god, president, military, incident, precinct, squad, officer, survivor).
# season: day of the year it starts on (0 = 1 January). origin xy:0.4,0.6 = a place on the map.
# Goals: hold / evacuate / retake / protect / survive (one region), holdcity / evaccoast / retakestate / protectcap (a country).
[scenario sandbox]
name = Open sandbox
mode = sandbox
origin = none
desc = A calm country going about its day. Paint the dead anywhere and watch the whole country respond.

[scenario lab_leak]
name = Lab leak
mode = sandbox
origin = lab
zombies = 25
desc = Something got out of a research building downtown. It starts with a handful of staff; others were bitten and went home before anyone knew, and they fall ill through the day.

[scenario airliner]
name = Crashed airliner
mode = sandbox
origin = crash
zombies = 260
desc = A passenger jet came down in the fields on the edge of the city. The passengers are walking towards the lights, and the people who pulled survivors from the wreck were bitten.

[scenario prison]
name = Prison riot
mode = sandbox
origin = prison
zombies = 60
desc = The county prison went quiet an hour ago. Then the gates opened. A few got out before the lockdown and went home to the nearest town.

[scenario festival]
name = Summer festival
mode = sandbox
origin = festival
zombies = 30
desc = Thousands are in the park for a festival when the first bites happen in the crowd. People bitten in the crush have already gone home.

[scenario hold_city]
name = Hold the capital for 30 days
mode = commander
origin = lab
zombies = 8000
hordes = 4
hordeSize = 15000
goal = holdcity
days = 30
desc = It got out of a lab in the capital last night: eight thousand of the dead are in the districts round it, thickest near the lab and most still inside the buildings, and four hordes of fifteen thousand are loose in the country. Keep at least half of the capital's people alive (at home or evacuated safely) for thirty days. Use fast-forward for the quiet stretches.

[scenario evacuate]
name = Evacuate the coast
mode = commander
origin = port
zombies = 6000
hordes = 2
hordeSize = 15000
goal = evaccoast
days = 6
desc = A ship full of the dead docked overnight. Get six in ten of the people on the coast inland within six days, before the hordes reach them.

[scenario retake]
name = Retake the state
mode = commander
origin = state
zombies = 250000
goal = retakestate
days = 20
desc = One state has fallen. A quarter of a million of the dead fill its towns and fields, and hordes roam it; its people fled to the capital. Bring the dead there down to one in a hundred within twenty days.

[scenario protect]
name = Protect the capital
mode = commander
origin = edges
zombies = 180000
goal = protectcap
days = 15
desc = Six hordes of thirty thousand are marching on the capital from every side, the first a day or so away and the rest a couple of days apart. Don't let the dead hold a fifth of its streets for a whole day, for fifteen days.

[scenario port]
name = The ship
mode = sandbox
origin = port
zombies = 800
desc = A cargo ship drifts into the docks of the biggest town on the coast at dawn. Nobody answers the radio. Then the hatches open. Some of the crew got ashore in the night.

[scenario random]
name = Somewhere
mode = sandbox
origin = random
zombies = 300
desc = It starts somewhere in the country: a city or a town picked by the seed, and some of the bitten don't know it yet. Find it before it spreads.

[scenario officer]
name = On patrol
mode = survivor
origin = lab
zombies = 200
role = officer
goal = survive
days = 2
desc = You are a police officer with your patrol when the calls start. Stay alive for two days.

[scenario survivor]
name = Survivor
mode = survivor
origin = lab
zombies = 60
hordes = 2
hordeSize = 900
goal = survive
days = 2
desc = You are one person in the city when it starts. Survive for two days, or reach an evacuation point.

