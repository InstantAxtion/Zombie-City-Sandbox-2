# ---------------------------------------------------------------- rules
# The numbers the simulation runs on. Rates are per game second unless said otherwise.
[rules default]
# indoors: bites per zombie per second among people sheltering, seconds for the infected to turn
indoorBite = 0.003
# how hard the sheltering are to find: bites slow down where few people are left (people per sector; a national
# map's sectors hold real densities, a few hundred people where today's hold thousands)
indoorDensity = 10000
indoorDensity@national = 300
# game seconds for the bitten to turn (a game hour is 60 s): hours, not minutes
turnTime = 180
# however many of the dead are outside, a street (sector) loses at most this share of its people an hour
maxBitePerHour = 0.005
# ... but at least this many bites per 10 game seconds where the dead are among people sheltering
biteFloor = 0.5
biteFloor@national = 2
# more of the dead than this in one sector spill into the next streets
sectorSpill = 3000
sectorSpill@national = 300
# armed units clearing buildings: the dead destroyed per armed person per second
clearRate = 0.015
# fights resolved as numbers (where nobody watches): the dead destroyed per armed person per second, and
# armed people lost per zombie per second
aggregateKill = 0.014
aggregateKill@national = 0.005
aggregateLoss = 0.00005
# the dead are harder to find where they're few: kills in a sector fall off below about this many of them
findHalf = 300
findHalf@national = 10
# rounds of ammunition spent for each of the dead put down (fights as numbers)
roundsPerKill = 4
# the general: formations sent per this many reported dead; idle formations go home after this long (game s)
deadPerFormation = 2500
goHomeAfter = 720
# outside units go home once the alert is down to a state of emergency and they've been idle this long
leaveAfter = 720
# sweeps: once the whole country has fewer of the dead than this, patrols hunt down the last of them, a share an
# hour (35% in towns, 20% in the fields, times sweepRate)
sweepBelow = 4000
sweepBelow@national = 20000
sweepRate = 1
sweepRate@national = 0.5
# ... and only once they are down to this share of the most there ever were (0: whatever the peak)
sweepPeakShare = 0
sweepPeakShare@national = 0.08
# game seconds between a battery's fire missions, and between air strikes
gunEvery = 60
strikeEvery = 180
# mobilisation (the Guard, then regular formations) until the army has this many soldiers, plus this many per reported dead
soldiersBase = 2500
soldiersPerDead = 0.1
# most formations in the country at once (a national map has room for twice the army)
maxFormations = 22
maxFormations@national = 45
# the general sends formations against hordes still waiting to set off (0: only once they're on the move)
interceptWaiting = 1
interceptWaiting@national = 0
# police per resident, kept at the stations
policePerResident = 0.0022
# seconds an idle squad waits at home before standing down into the station's pool
standDown = 20
# national mobilisation: game seconds between new army formations arriving (the Guard a quarter slower)
mobiliseEvery = 300
# the dead in the heat lose this share an hour above 28 C; the cold slows them below 0 C
rotPerHour = 0.004
coldSpeed = 0.7

# ---------------------------------------------------------------- infrastructure and logistics
# Food is counted in person-days, fuel in tonnes, medicine in doses. Speeds in px per game second.
[rules logistics]
# days of food each city and town keeps at the start, and what one person eats a day
foodDays = 5
townFoodDays = 4
eatPerDay = 1
# person-days a sampled farmland tile grows a day (farms feed the nearest town)
farmYield = 2
# days without water before people start walking out
waterDays = 2
# hospital medicine used per infected person a day
medPerInfected = 0.5
# tonnes of fuel a formation burns per game second on the move
formationFuel = 0.02
# road convoys and trains (on national maps: 30 and 60 km/h)
convoySpeed = 35
convoySpeed@national = 30 km/h
trainSpeed = 90
trainSpeed@national = 60 km/h
# imports from abroad, every this many game seconds: what the port and airfields are topped up to
importEvery = 360
portFood = 400000
portFuel = 800
airMed = 3000
airAmmo = 60000
airFood = 100000
# a town asks for food below this many days of it, and is filled to this many
foodRequestDays = 4
foodFullDays = 7
# hauls longer than this (px) between two towns with stations go by train
trainOver = 2500
trainOver@national = 20 km
