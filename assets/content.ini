# ---------------------------------------------------------------- map presets
# terrain = coast (the sea along one side), valley (a broad river between hills), highlands (ridges), lakes.
# The land's height is level + noise x relief + the terrain's feature: coast: min(distance from the sea - featureAt,
# featureCap) x feature; valley: distance from the river's line x feature; highlands: ridges (noise every
# featureScale tiles) x feature; lakes: lakes where noise (every featureScale tiles) passes featureAt, x feature.
# rivers = how many (or a range, 1-2), plus one per 1,024 tiles of map; naval = 1: a naval station on the water.
# A new preset (index 4 on) can use any terrain with its own numbers.
